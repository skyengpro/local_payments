name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Server (Frappe version-16, ERPNext)

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v7

      # uv installs Python 3.14 itself and caches its downloads (replaces setup-python and the pip cache).
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      # bench runs `yarn install` for frappe and erpnext, so Node stays. No check-latest:
      # it forces a download instead of using the version preinstalled on the runner.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB client
        run: |
          sudo apt update
          sudo apt-get install -y --no-install-recommends mariadb-client

      - name: Init bench
        run: |
          uv tool install frappe-bench
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          bench init \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(uv python find 3.14)" \
            --frappe-branch version-16 \
            ~/frappe-bench

      - name: Get apps
        working-directory: /home/runner/frappe-bench
        run: |
          # local_payments implements the frappe/payments gateway contract
          # it is a hard dependency, not optional.
          #
          bench get-app payments --branch version-16
          # pinned SHA of payments version-16: reproducible, known rollback point
          # get-app clones shallow, so the pin is gone from the clone once version-16 moves on.
          git -C apps/payments fetch --depth 1 https://github.com/frappe/payments cca07d9f9392e2ea0e521c5975151db9e4b6c321
          git -C apps/payments checkout cca07d9f9392e2ea0e521c5975151db9e4b6c321
          # ERPNext is installed: Payment Requests get settled against it.
          bench get-app erpnext --branch version-16
          bench get-app local_payments "$GITHUB_WORKSPACE"
          bench setup requirements --dev

      - name: Create site and install apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app payments
          bench --site test_site install-app erpnext
          bench --site test_site install-app local_payments
          bench build --app local_payments
        env:
          CI: 'Yes'

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app local_payments
        env:
          TYPE: server

      - name: Show bench logs on failure
        if: failure()
        working-directory: /home/runner/frappe-bench
        run: |
          cat bench_start.log 2>/dev/null || true
          for f in logs/*.log; do
            echo "== $f =="
            cat "$f"
          done
