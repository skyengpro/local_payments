name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Server (Frappe version-16)

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB client
        run: |
          sudo apt update
          sudo apt-get install -y mariadb-client

      - name: Init bench
        run: |
          pip install frappe-bench
          bench init \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            --frappe-branch version-16 \
            ~/frappe-bench

      - name: Get apps
        working-directory: /home/runner/frappe-bench
        run: |
          # local_payments implements the frappe/payments gateway contract
          # it is a hard dependency, not optional.
          #
          bench get-app payments --branch develop
          bench get-app local_payments "$GITHUB_WORKSPACE"
          bench setup requirements --dev

      - name: Create site and install apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app payments
          bench --site test_site install-app local_payments
          bench build --app local_payments
        env:
          CI: 'Yes'

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app local_payments --coverage
        env:
          TYPE: server

      - name: Show bench logs on failure
        if: failure()
        working-directory: /home/runner/frappe-bench
        run: |
          cat bench_start.log 2>/dev/null || true
          for f in logs/*.log; do
            echo "== $f =="
            cat "$f"
          done
      # - name: Upload coverage
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: coverage
      #     path: /home/runner/frappe-bench/sites/coverage.xml
      #     retention-days: 14